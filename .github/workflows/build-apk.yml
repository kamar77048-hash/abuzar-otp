name: Build ABUZAR OTP APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ABUZAR_OTP_Android_BuildReady.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir android-project
          unzip ABUZAR_OTP_Android_BuildReady.zip -d android-project
          find android-project -name gradlew -type f

      - name: Build APK
        run: |
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABUZAR-OTP-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
